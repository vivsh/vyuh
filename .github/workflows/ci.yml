name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Mool prerequisite
        run: git clone --depth 1 https://github.com/vivsh/mool.git ../mool
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lint backendless framework
        run: cargo clippy -p vyuh --no-default-features -- -D warnings
      - name: Lint PostgreSQL framework
        run: cargo clippy -p vyuh --no-default-features --features postgres -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Mool prerequisite
        run: git clone --depth 1 https://github.com/vivsh/mool.git ../mool
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Django fixture dependency
        run: python -m pip install "Django==5.2.*"
      - name: Verify Django cross-language fixtures
        run: python vyuh/tests/fixtures/django_signing.py
      - name: Run backendless unit and integration suite
        run: cargo test -p vyuh --no-default-features

  auth-codecs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [oidc, paseto, branca, "oidc,paseto,branca"]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Mool prerequisite
        run: git clone --depth 1 https://github.com/vivsh/mool.git ../mool
      - uses: dtolnay/rust-toolchain@stable
      - name: Test authentication codec feature set
        run: cargo test -p vyuh --no-default-features --features ${{ matrix.features }} --test auth

  feature-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - sqlite
          - postgres
          - mysql
          - sqlite,migrations
          - postgres,migrations
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Mool prerequisite
        run: git clone --depth 1 https://github.com/vivsh/mool.git ../mool
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile selected feature set
        run: cargo check -p vyuh --no-default-features --features ${{ matrix.features }}

  postgres-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vyuh
          POSTGRES_PASSWORD: vyuh
          POSTGRES_DB: vyuh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vyuh -d vyuh_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Mool prerequisite
        run: git clone --depth 1 https://github.com/vivsh/mool.git ../mool
      - uses: dtolnay/rust-toolchain@stable
      - name: Run PostgreSQL migration and task contracts
        env:
          DATABASE_URL: postgres://vyuh:vyuh@localhost:5432/vyuh_ci
        run: cargo test -p vyuh --no-default-features --features postgres,migrations --lib tasks::store_tests

  sqlite-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Mool prerequisite
        run: git clone --depth 1 https://github.com/vivsh/mool.git ../mool
      - uses: dtolnay/rust-toolchain@stable
      - name: Run SQLite migration and task contracts
        run: cargo test -p vyuh --no-default-features --features sqlite,migrations --lib tasks::store_tests

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install mdBook
        run: cargo install mdbook --version 0.5.3 --locked
      - name: Build book
        run: mdbook build docs/book

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Mool prerequisite
        run: git clone --depth 1 https://github.com/vivsh/mool.git ../mool
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
