name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.92.0"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Check Vyuh at the declared MSRV
        run: cargo check -p vyuh --no-default-features --features oauth,id-token,federated,mcp,paseto,branca
      - name: Check Vyuh macros at the declared MSRV
        run: cargo check -p vyuh-macros

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: Lint backendless framework
        run: cargo clippy -p vyuh --no-default-features -- -D clippy::correctness -D clippy::suspicious
      - name: Lint PostgreSQL framework
        run: cargo clippy -p vyuh --no-default-features --features postgres -- -D clippy::correctness -D clippy::suspicious

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Django fixture dependency
        run: python -m pip install "Django==5.2.*"
      - name: Verify Django cross-language fixtures
        run: python vyuh/tests/fixtures/django_signing.py
      - name: Run backendless unit and integration suite
        run: cargo test -p vyuh --no-default-features

  auth:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: oauth
            tests: --lib auth::oauth
          - features: id-token
            tests: --lib auth::id_token
          - features: federated,paseto,branca
            tests: --test auth
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Test the selected auth feature
        run: cargo test -p vyuh --no-default-features --features ${{ matrix.features }} ${{ matrix.tests }}
      - name: Test federated provider internals
        if: contains(matrix.features, 'federated')
        run: cargo test -p vyuh --no-default-features --features ${{ matrix.features }} --lib auth::login::federated

  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Test email delivery and SMTP behavior
        run: cargo test -p vyuh --no-default-features --features email,mcp --test email_delivery
      - name: Test mail capture and isolation
        run: cargo test -p vyuh --no-default-features --features email,test-support --test email
      - name: Test MCP protocol and routing
        run: cargo test -p vyuh --no-default-features --features email,mcp --lib mcp::tests

  feature-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend:
          - sqlite
          - postgres
          - mysql
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Check the minimal backend
        run: cargo check -p vyuh --no-default-features --features ${{ matrix.backend }}
      - name: Check the backend with migrations
        run: cargo check -p vyuh --no-default-features --features ${{ matrix.backend }},migrations

  docs:
    # The Pages workflow already builds the book on main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install mdBook
        run: cargo install mdbook --version 0.5.3 --locked
      - name: Build book
        run: mdbook build docs/book

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Resolve the workspace dependency graph
        run: cargo generate-lockfile
      - name: Install RustSec audit CLI
        run: cargo install cargo-audit --version 0.23.0 --locked --no-default-features
      - name: Audit resolved dependencies
        run: cargo audit --file Cargo.lock
