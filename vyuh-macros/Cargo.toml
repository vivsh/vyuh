[package]
name = "vyuh-macros"
version = "0.2.13"
edition = "2024"
license = "MIT"
description = "Procedural macros for the Vyuh web framework"
readme = "../README.md"
repository = "https://github.com/vivsh/vyuh"
documentation = "https://docs.rs/vyuh-macros"

[lib]
proc-macro = true


[dependencies]
include_dir = { version = "0.7.4", features = ["glob"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
darling = "0.20"
heck = "0.4"
cron = "0.12"
mool-macros-impl = { git = "https://github.com/vivsh/mool.git", rev = "0f8628158fa56503948377851bad218be1b8bf96" }
rust-silos-macros-impl = "0.1.0"

tokio = {workspace = true}

[dev-dependencies]
vyuh = { path = "../vyuh", features = ["postgres", "migrations", "test-support"] }
schemars = "1"
trybuild = "1.0"
