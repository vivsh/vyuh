[package]
name = "vyuh"
version = "0.2.21"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "Vyuh web framework for Axum and SQLx with handler-first APIs"
readme = "../README.md"
repository = "https://github.com/vivsh/vyuh"
documentation = "https://docs.rs/vyuh"

[features]
default = []
postgres = ["db_core/postgres"]
mysql = ["db_core/mysql"]
sqlite = ["db_core/sqlite"]
cors = ["tower-http/cors"]
migrations = ["db_core/migrations"]
test-support = ["db_core/test-support"]
paseto = ["dep:pasetors"]
branca = ["dep:branca"]
federated = ["dep:arc-swap", "dep:openidconnect", "dep:oauth2", "dep:reqwest"]
mcp = ["dep:jsonschema", "dep:mime"]
oauth = ["dep:huskarl-resource-server", "dep:reqwest"]
id-token = ["dep:huskarl-resource-server", "dep:reqwest"]
email = ["dep:lettre"]

[dependencies]
axum = {workspace = true}
axum-extra = {workspace = true}
chrono = {workspace = true}
chrono-tz = "0.10"
cron = "0.12"
indexmap = {workspace = true}
rand = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
smallvec = "1.13"
tokio = {workspace = true}
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = {workspace = true}
minijinja = { workspace = true, features = ["loader"] }
blake3 = {workspace = true}
dotenvy = {workspace = true}
tower = {workspace = true}
thiserror = {workspace = true}
infer = {workspace = true}
matchit = {workspace = true}
mime_guess = "2.0.5"
url = "2.5.4"
tower-http = {version="0.6.2", features=["catch-panic", "compression-full", "cors", "fs", "trace"]}
strum = { version = "0.27.1", features = ["derive", "strum_macros"] }
jsonwebtoken = "9.3.1"
pasetors = { version = "0.7.8", optional = true, default-features = false, features = ["std", "v4", "paserk", "serde"] }
branca = { version = "0.10.2", optional = true }
openidconnect = { version = "4.0.1", optional = true }
arc-swap = { version = "1.7", optional = true }
oauth2 = { version = "5.0.0", optional = true, default-features = false, features = ["reqwest", "rustls-tls"] }
flate2 = "1.1"
schemars = "1.0.4"
time = "0.3.41"

# Password hashing utilities (Django-compatible PBKDF2)
base64 = "0.21"
ring = "0.16"

tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json", "time", "ansi", "tracing-log"] }
tracing-appender = "0.2"

http-serde = "2.1.1"
serde_urlencoded = "0.7"
rust-silos = { version = "^0.3.2" }

vyuh-macros = { path = "../vyuh-macros", version = "0.2.21" }
db_core = { package = "mool", version = "0.2.11" }
once_cell = { version = "1.21.3", features = ["parking_lot"] }
axum-test = "17.3.0"
notify = "^8.1"
futures = "0.3.31"
twox-hash = "1.6"
regex = "1.12.2"
parking_lot = "0.12.5"
openapiv3 = "2.2.0"
either = "1.15.0"
bytes = "1.8"
bitflags = { version = "2.6", features = ["serde"] }
openapiv3_1 = "0.1.3"
tokio-util = "0.7.18"
percent-encoding = "2.3.2"
sysinfo = "0.33"
tempfile = "3"
serde_yaml = "0.9"
lettre = { version = "0.11.22", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "pool"], optional = true }
html2text = "0.17.1"
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "stream"] }
huskarl-resource-server = { version = "=0.10.1", optional = true }
jsonschema = { version = "0.49.8", optional = true, default-features = false }
mime = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1.46.1", features = ["full", "test-util"] }
trybuild = "1.0"
rand08 = { package = "rand", version = "0.8" }
rsa = "0.9"
sqlx = { workspace = true, features = ["macros", "migrate", "chrono", "runtime-tokio", "uuid", "json", "postgres", "mysql", "sqlite"] }

[[example]]
name = "tasks"
path = "examples/tasks.rs"

[[example]]
name = "signals_emitters"
path = "examples/signals_emitters.rs"

[[example]]
name = "console"
path = "examples/console.rs"

[[example]]
name = "getting_started"
path = "examples/getting_started.rs"
required-features = ["sqlite"]

[[example]]
name = "blog"
path = "examples/blog.rs"
required-features = ["postgres", "migrations"]
