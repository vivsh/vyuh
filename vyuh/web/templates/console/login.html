<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Vyuh Console</title>
  <link rel="icon" href="{{ assets.favicon }}">
  <link rel="stylesheet" href="{{ stylesheet_path }}">
</head>
<body class="vyuh-page console-body">
  <section class="console-login">
    <main class="vyuh-card console-login-card">
      <header class="console-login-header">
        <img class="console-login-logo" src="{{ assets.logo }}" alt="Vyuh logo">
        <p class="vyuh-kicker">Console login</p>
        <h1 class="vyuh-section-title">Enter a console login token.</h1>
        <p class="vyuh-copy">Generate a short-lived token with <code>vyuh console-token</code>.</p>
      </header>
      {% if error %}<p class="vyuh-alert console-login-error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="{{ login_url }}" class="console-login-form">
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <label class="vyuh-field">
          <span>Login token</span>
          <input type="password" name="token" autocomplete="one-time-code" required>
        </label>
        <button class="vyuh-button vyuh-button-primary" type="submit">Sign in</button>
      </form>
      <footer><small>Vyuh Console v{{ version }}</small></footer>
    </main>
  </section>
</body>
</html>
