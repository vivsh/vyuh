# Apply offline with workers and writers stopped and old affinity released.
dependencies: [0015_sticky_flows]
atomic: true
operations:
  - type: drop_index
    table_name: vyuh_tasks
    index:
      name: idx_vyuh_tasks_flow_ready
      columns: [node_id, lane_name, ready_at, created_at, id]
      unique: false
      predicate: "kind = 1 AND status = 0 AND node_id IS NOT NULL"
  - type: add_index
    table_name: vyuh_tasks
    index:
      name: idx_vyuh_tasks_owned_ready
      columns: [node_id, lane_name, ready_at, created_at, id]
      unique: false
      predicate: "status = 0 AND node_id IS NOT NULL"
