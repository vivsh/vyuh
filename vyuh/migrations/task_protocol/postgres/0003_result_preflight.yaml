dependencies: [0002_resume_results]
atomic: true
operations:
  - type: statement
    up: >-
      CREATE TEMP TABLE vyuh_result_preflight (task_id VARCHAR(191), valid INTEGER NOT NULL CHECK (valid = 1))
  - type: statement
    up: >-
      INSERT INTO vyuh_result_preflight (task_id, valid) SELECT id::text, CASE WHEN (resume_input IS NULL OR (octet_length(resume_input) <= 32768 AND (CASE WHEN resume_input IS JSON OBJECT THEN
       (SELECT count(*) FROM json_object_keys(resume_input::json)) = 1 AND
       ((resume_input::json->'Ok' IS NOT NULL) OR
       (json_typeof(resume_input::json->'Err') = 'object'
       AND json_typeof(resume_input::json->'Err'->'message') = 'string'
       AND (resume_input::json->'Err'->'task_id' IS NULL
       OR json_typeof(resume_input::json->'Err'->'task_id') = 'null'
       OR (resume_input::json->'Err'->>'task_id') ~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')))
       ELSE false END))) AND (last_error IS NULL OR octet_length(json_build_object('Err', json_build_object('task_id', id::text, 'message', last_error))::text) <= 32768) THEN 1 ELSE 0 END FROM vyuh_tasks
  - type: statement
    up: >-
      INSERT INTO vyuh_result_preflight (task_id, valid) SELECT 'runtime policy', CASE WHEN SUBSTR(policy_fingerprint, 1, 6) IN ('tr-up:', 'tr-v1:') THEN 1 ELSE 0 END FROM vyuh_task_runtime
  - type: statement
    up: >-
      DROP TABLE vyuh_result_preflight
